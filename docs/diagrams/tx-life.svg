<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:#1f2328}
.t{font-size:20px;font-weight:600}
.s{font-size:13px;fill:#59636e}
.h{font-size:13px;font-weight:600}
.lbl{font-size:15px;font-weight:600}
.m{fill:#59636e}
.b{font-weight:600}
.red{fill:#a40e26}
.grn{fill:#116329}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.ln{stroke:#57606a;stroke-width:1.5;fill:none}
.box{fill:#ffffff;stroke:#8c959f;stroke-width:1.2}
.bad{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.good{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.gray{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
.panel{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
</style>
<rect width="1120" height="500" fill="#ffffff"/>
<text x="30" y="40" class="t">Life of a tx: the high-level flow</text>
<text x="30" y="62" class="s">Tx T creates post P. Steps 2, 3 and 5 run on every node; step 4 runs on nodes that mine.</text>
<text x="30" y="82" class="s">seen_txs: the IDs of txs included in a chain's last TX_TTL blocks. Each block's state has its own.</text>
<rect x="30" y="100" width="188" height="120" rx="8" class="box"/>
<text x="124.0" y="124" class="h" text-anchor="middle">1. Author signs T</text>
<text x="124.0" y="146" text-anchor="middle">valid_until_height ≤ the</text>
<text x="124.0" y="162" text-anchor="middle">author's tip + 1 + TX_TTL,</text>
<text x="124.0" y="178" text-anchor="middle">minus a margin so nodes</text>
<text x="124.0" y="194" text-anchor="middle">a block behind accept it</text>
<rect x="248" y="100" width="188" height="120" rx="8" class="box"/>
<text x="342.0" y="124" class="h" text-anchor="middle">2. Arrives at a node</text>
<text x="342.0" y="146" text-anchor="middle">dropped if its ID is in</text>
<text x="342.0" y="162" text-anchor="middle">the mempool or the best</text>
<text x="342.0" y="178" text-anchor="middle">tip's seen_txs, or its</text>
<text x="342.0" y="194" text-anchor="middle">signature or window fails</text>
<rect x="466" y="100" width="188" height="120" rx="8" class="box"/>
<text x="560.0" y="124" class="h" text-anchor="middle">3. Mempool</text>
<text x="560.0" y="146" text-anchor="middle">stored and relayed</text>
<text x="560.0" y="162" text-anchor="middle">to peers; one mempool</text>
<text x="560.0" y="178" text-anchor="middle">shared by all forks</text>
<rect x="684" y="100" width="188" height="120" rx="8" class="box"/>
<text x="778.0" y="124" class="h" text-anchor="middle">4. Miner builds a block</text>
<text x="778.0" y="146" text-anchor="middle">the miner tries T against</text>
<text x="778.0" y="162" text-anchor="middle">its tip's state; if it</text>
<text x="778.0" y="178" text-anchor="middle">fails, it is retried</text>
<text x="778.0" y="194" text-anchor="middle">on the next block</text>
<rect x="902" y="100" width="188" height="120" rx="8" class="good"/>
<text x="996.0" y="124" class="h" text-anchor="middle">5. Accepted in block h</text>
<text x="996.0" y="146" text-anchor="middle">seen_txs gains T</text>
<text x="996.0" y="162" text-anchor="middle">posts gains P</text>
<text x="996.0" y="178" text-anchor="middle">once h is the best tip,</text>
<text x="996.0" y="194" text-anchor="middle">mempool loses T</text>
<path d="M218,160 H246" class="ln" marker-end="url(#a)"/>
<path d="M436,160 H464" class="ln" marker-end="url(#a)"/>
<path d="M654,160 H682" class="ln" marker-end="url(#a)"/>
<path d="M872,160 H900" class="ln" marker-end="url(#a)"/>
<path d="M342,220 V296" class="ln" marker-end="url(#a)"/>
<text x="334" y="275" class="m" text-anchor="end">any check fails</text>
<rect x="252" y="300" width="180" height="50" rx="8" class="bad"/>
<text x="342.0" y="321" class="h" text-anchor="middle">Dropped</text>
<text x="342.0" y="339" text-anchor="middle">not stored, not relayed</text>
<path d="M560,220 V296" class="ln" marker-end="url(#a)"/>
<text x="568" y="275" class="m">after each best-tip change</text>
<rect x="445" y="300" width="230" height="50" rx="8" class="gray"/>
<text x="560.0" y="321" class="h" text-anchor="middle">Expired</text>
<text x="560.0" y="339" text-anchor="middle">valid_until_height ≤ best height</text>
<path d="M996,220 V245 H620 V223" class="ln" marker-end="url(#a)"/>
<text x="808" y="239" class="m" text-anchor="middle">reorg off block h: T returns, unless the new best has T</text>
<text x="30" y="398" class="h">After block h</text>
<path d="M220,450 H636" class="ln"/>
<path d="M630,458 L638,442" class="ln"/>
<path d="M642,458 L650,442" class="ln"/>
<path d="M644,450 H1000" class="ln" marker-end="url(#a)"/>
<circle cx="220" cy="450" r="5" fill="#1f2328"/>
<text x="220" y="434" class="b" text-anchor="middle">T included, post P created</text>
<text x="220" y="474" class="m" text-anchor="middle">block h</text>
<circle cx="430" cy="450" r="5" fill="#1f2328"/>
<text x="430" y="434" class="b" text-anchor="middle">T's ID forgotten</text>
<text x="430" y="474" class="m" text-anchor="middle">+1 hour (TX_TTL = 120 blocks)</text>
<circle cx="880" cy="450" r="5" fill="#1f2328"/>
<text x="880" y="434" class="b" text-anchor="middle">post P dropped</text>
<text x="880" y="474" class="m" text-anchor="middle">+7 days (R = 20,160 blocks)</text>
</svg>
